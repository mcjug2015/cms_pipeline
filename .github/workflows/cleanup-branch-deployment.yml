name: Cleanup branch deployment

# Fires when a branch is deleted. The workflow file is read from the default
# branch (the deleted branch is gone)
on:
  delete:

jobs:
  destroy:
    # Only branch deletions (ignore tag deletions).
    if: github.event.ref_type == 'branch'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      # No actions/setup-python step, for the same reason ci.yml gives: this
      # self-hosted runner already has 3.12.3 via pyenv, and pants.toml's
      # [python-bootstrap] search_path includes "<PYENV>", so Pants finds it.

      - name: Initialize Pants
        shell: bash
        run: |
          # Ensure the launcher (installed at ~/.local/bin/pants) is on PATH.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v pants >/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
              --retry-all-errors --create-dirs -fsSLo "$RUNNER_TEMP/get-pants.sh" \
              https://raw.githubusercontent.com/pantsbuild/setup/main/get-pants.sh
            bash "$RUNNER_TEMP/get-pants.sh"
          fi
          pants --version

      - name: Generate lockfiles
        # Both lockfiles are gitignored and actions/checkout's default clean runs
        # `git clean -ffdx`, so a checked-out workspace has neither. Without them
        # the wheel build below dies with no lockfile for the python-default
        # resolve -- which took this whole teardown job down with it.
        run: pants generate-lockfiles

      - name: Generate Wheels
        # The bundle references ../dist/*.whl; build it so `bundle destroy` can
        # resolve the artifact
        run: pants package src/

      - name: Destroy the branch's bundle deployment
        working-directory: dab
        env:
          # OAuth machine-to-machine (service principal). Host comes from the bundle.
          DATABRICKS_CLIENT_ID: 4fbddd7d-9f0c-4ae6-a90e-6f15434815a1
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          # Pass the ref via env (not inline ${{ }}) to avoid shell injection from
          # attacker-controlled branch names.
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
            # Same slug the deploy used, so we tear down the right deployment.
            branch_slug="$(bash ../scripts/branch_slug.sh "$DELETED_BRANCH")"
            databricks bundle destroy -t dev --auto-approve --var="branch=${branch_slug}"

      - name: Drop the branch's catalog
        # After the bundle destroy, never before: the bundle's job and dashboard
        # read this catalog. Nothing else drops it, so without this step every
        # branch that ever ran CI leaves its catalog in Unity Catalog for good.
        if: always()
        shell: bash
        env:
          # Same service principal as the destroy above. A plain CLI call reads no
          # bundle, so unlike that step the host has to come from here.
          DATABRICKS_CLIENT_ID: 4fbddd7d-9f0c-4ae6-a90e-6f15434815a1
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_HOST: https://dbc-807557d7-311c.cloud.databricks.com
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          # The name ci.yml's "Apply ddl" builds for a non-main branch. Always
          # slug-prefixed, so this can never name main's shared dbr_dbc_cat.
          branch_slug="$(bash scripts/branch_slug.sh "$DELETED_BRANCH")"
          if [ -z "$branch_slug" ]; then
            echo "::error::empty slug for '$DELETED_BRANCH'; refusing to guess a catalog"
            exit 1
          fi
          cat_name="${branch_slug}_dbr_dbc_cat"
          if databricks catalogs get "$cat_name" >/dev/null 2>&1; then
            # --force: the chain leaves schemas, tables and a volume in there.
            databricks catalogs delete "$cat_name" --force
            echo "dropped $cat_name"
          else
            echo "no $cat_name catalog; nothing to drop"
          fi

      - name: Delete the branch's pre-migrated Spark image tag from GHCR
        # Independent of the Databricks teardown: a failed destroy shouldn't
        # leave the image behind too.
        if: always()
        shell: bash
        env:
          # Same classic PAT as CI's push (see ci.yml), which also needs
          # delete:packages here; GITHUB_TOKEN is refused on this user-owned
          # package. The script reads it as GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DELETED_BRANCH: ${{ github.event.ref }}
        run: |
          # Same slug CI tagged the image with (scripts/build_migrated_image.sh).
          branch_slug="$(bash scripts/branch_slug.sh "$DELETED_BRANCH")"
          python3 scripts/delete_ghcr_branch_tag.py "$GITHUB_REPOSITORY_OWNER" "$branch_slug"
