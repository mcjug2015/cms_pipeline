name: Run Pants Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3' # Use the python version required by your repo

      - name: Initialize Pants
        uses: pantsbuild/actions/init-pants@main
        with:
          base-branch: main

      - name: Generate lockfiles
        run: pants generate-lockfiles

      - name: Validate autoformat
        run: 'pants --keep-sandboxes=always lint ::'

      - name: Run Tests
        run: 'pants --keep-sandboxes=always test --output=all --test-force ::'