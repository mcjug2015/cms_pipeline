name: Run Pants Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-generate:
    runs-on: self-hosted
    env:
      # Fan local process execution out across 12 cores on this 16-core runner.
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: "12"
    steps:
      - name: Configure Pants caches
        shell: bash
        run: |
          echo "PANTS_NAMED_CACHES_DIR=$HOME/.cache/pants/named_caches" >> "$GITHUB_ENV"
          echo "PANTS_LOCAL_STORE_DIR=$HOME/.cache/pants/lmdb_store" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: '3.12.3' # Use the python version required by your repo

      - name: Initialize Pants
        shell: bash
        run: |
          # The pantsbuild/actions/init-pants action wraps ~/.cache/pants and ~/.cache/nce in actions/cache; on this persistent runner
          # Ensure the launcher (installed at ~/.local/bin/pants) is on PATH for this and all subsequent steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v pants >/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
              --retry-all-errors --create-dirs -fsSLo "$RUNNER_TEMP/get-pants.sh" \
              https://raw.githubusercontent.com/pantsbuild/setup/main/get-pants.sh
            bash "$RUNNER_TEMP/get-pants.sh"
          fi
          pants --version

      - name: Generate lockfiles
        run: pants generate-lockfiles

      - name: Validate autoformat and types
        run: pants lint check src/ test/

      - name: Run Tests
        run: |
          rm -rf dist/test/reports
          pants test --output=all --test-force --use-coverage --report test/::

      - name: Enforce minimum test count
        run: |
          python - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          total = 0
          for f in glob.glob("dist/test/reports/*.xml"):
              root = ET.parse(f).getroot()
              for ts in root.iter("testsuite"):
                  total += int(ts.get("tests", 0)) - int(ts.get("skipped", 0))
          print(f"Total tests run: {total}")
          if total < 1:
              print("::error::Fewer than 1 tests were run", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Generate Wheels
        run: pants package src/

      - name: Upload Wheels
        uses: actions/upload-artifact@main
        with:
          name: wheels
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Apply ddl
        # Only publish from main; PR builds validate but must not mutate the workspace.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # OAuth machine-to-machine (service principal). The application id is
          # the client id and is not secret; the secret must be a repo secret.
          DATABRICKS_CLIENT_ID: 4fbddd7d-9f0c-4ae6-a90e-6f15434815a1
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          # databricks-connect needs the workspace host to complete OAuth M2M auth
          # (client id + secret alone can't resolve which workspace to sign into),
          # plus a compute target; "auto" picks serverless. The Deploy step gets
          # host from the bundle, but this step has no bundle, so set it explicitly.
          DATABRICKS_HOST: https://dbc-807557d7-311c.cloud.databricks.com
          DATABRICKS_SERVERLESS_COMPUTE_ID: auto
        run: |
            pants run src/crutch_migrations/run_crutch_migrations.py:lib -- --cat=dbr_dbc_cat --schema=testing_testing

      - name: Deploy manipulator_job (Databricks bundle)
        # Only publish from main; PR builds validate but must not mutate the workspace.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: dab
        env:
          # OAuth machine-to-machine (service principal). The application id is
          # the client id and is not secret; the secret must be a repo secret.
          DATABRICKS_CLIENT_ID: 4fbddd7d-9f0c-4ae6-a90e-6f15434815a1
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
            databricks bundle deploy -t dev
