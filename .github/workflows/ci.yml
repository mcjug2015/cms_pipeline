name: Run Pants Tests
on:
  push:

jobs:
  validate-and-generate:
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      # Fan local process execution out across 12 cores on this 16-core runner.
      PANTS_PROCESS_EXECUTION_LOCAL_PARALLELISM: "12"
      DATABRICKS_CLIENT_ID: 4fbddd7d-9f0c-4ae6-a90e-6f15434815a1
      DATABRICKS_HOST: https://dbc-807557d7-311c.cloud.databricks.com
    steps:
      - name: Configure Pants caches
        shell: bash
        run: |
          echo "PANTS_NAMED_CACHES_DIR=$HOME/.cache/pants/named_caches" >> "$GITHUB_ENV"
          echo "PANTS_LOCAL_STORE_DIR=$HOME/.cache/pants/lmdb_store" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@main

      # No actions/setup-python step: this self-hosted runner already has
      # 3.12.3 installed via pyenv, and pants.toml's [python-bootstrap]
      # search_path includes "<PYENV>", so Pants finds it directly. (GitHub's
      # hosted-tool manifest has no prebuilt 3.12.3 for this runner's OS anyway.)

      - name: Initialize Pants
        shell: bash
        run: |
          # The pantsbuild/actions/init-pants action wraps ~/.cache/pants and ~/.cache/nce in actions/cache; on this persistent runner
          # Ensure the launcher (installed at ~/.local/bin/pants) is on PATH for this and all subsequent steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v pants >/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
              --retry-all-errors --create-dirs -fsSLo "$RUNNER_TEMP/get-pants.sh" \
              https://raw.githubusercontent.com/pantsbuild/setup/main/get-pants.sh
            bash "$RUNNER_TEMP/get-pants.sh"
          fi
          pants --version

      - name: Generate lockfiles
        run: pants generate-lockfiles

      - name: Validate autoformat and types
        # `::` recurses; a bare `src/` would lint only targets directly in src/.
        # Quoted because the ": " inside "src/:: test" would otherwise parse as a YAML key.
        run: "pants lint check src/:: test/::"

      - name: Verify Docker access for Spark Connect test containers
        shell: bash
        run: |
          docker version
          docker info

      - name: Log in to GHCR
        shell: bash
        env:
          # A classic PAT (write:packages) rather than GITHUB_TOKEN: the package
          # is owned by the mcjug2015 user account, and GHCR answers GITHUB_TOKEN
          # pushes to it with 403 even with `packages: write` granted.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          # This self-hosted runner is a real user account: without its own
          # DOCKER_CONFIG, `docker login` here would overwrite that user's own
          # ghcr.io credentials. Under $RUNNER_TEMP, which the runner wipes after
          # each job and snap-confined docker can still reach, being inside $HOME.
          # Exported for every later docker command; "Log out of GHCR" cleans up.
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "$GHCR_TOKEN" | DOCKER_CONFIG="$docker_config" \
            docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin

          # GHCR_IMAGE is also what scripts/build_migrated_image.sh reads. The tag
          # is the branch slug, the same one that script pushes.
          ghcr_image="ghcr.io/mcjug2015/cms-pipeline-spark-migrated"
          slug="$(bash scripts/branch_slug.sh "$GITHUB_REF_NAME")"
          echo "GHCR_IMAGE=$ghcr_image" >> "$GITHUB_ENV"
          echo "MIGRATED_SPARK_IMAGE=$ghcr_image:$slug" >> "$GITHUB_ENV"

      - name: Build and push pre-migrated Spark image
        # Pushes only the branch slug tag. `latest` moves after the tests pass, in
        # "Promote pre-migrated Spark image to latest", so a main build that fails
        # its tests never displaces it.
        shell: bash
        run: scripts/build_migrated_image.sh --push

      - name: Start pre-migrated Spark Connect server
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/pytest-tmp"
          echo "PYTEST_TMP_BASE=$HOME/.cache/pytest-tmp" >> "$GITHUB_ENV"

          # Run what was pushed, not the local build, so the tests exercise the
          # published image.
          docker pull "$MIGRATED_SPARK_IMAGE"

          # Not scripts/start_migrated_spark_connect.sh: its fixed name and port, and
          # its removal of every other migrated container, would collide with
          # concurrent runs and the runner user's own container on this shared
          # docker. No --name, and a random host port, instead; later steps address
          # the container by ID. Root so the server can write into the mounted
          # pytest tmp dir. No --packages or ivy mount: the image bakes its jars and
          # Delta/metastore config in, and its default CMD starts the server.
          spark_container_id="$(docker run -d \
            --user 0:0 \
            -p 15002 \
            -v "$HOME/.cache/pytest-tmp:$HOME/.cache/pytest-tmp:rw" \
            "$MIGRATED_SPARK_IMAGE")"
          echo "SPARK_CONTAINER_ID=$spark_container_id" >> "$GITHUB_ENV"

          timeout 600 bash -c \
            "until docker logs '$spark_container_id' 2>&1 | grep -q 'Spark Connect server started at:'; do sleep 2; done"

          spark_connect_port="$(docker inspect -f '{{(index (index .NetworkSettings.Ports "15002/tcp") 0).HostPort}}' "$spark_container_id")"
          echo "WHICH_SPARK=remote" >> "$GITHUB_ENV"
          echo "SPARK_CONNECT_PORT=$spark_connect_port" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          rm -rf dist/test/reports
          pants test --output=all --test-force --use-coverage --report test/:: -test/integration::

      - name: Run integration tests
        # Runs after unit tests complete, as its own pants invocation, never fanned out
        # alongside them. Integration tests aren't covered by --use-coverage: coverage
        # only comes from unit tests (see CLAUDE.md "Laws of integration testing").
        run: |
          pants test --output=all --test-force --report test/integration::

      - name: Stop Spark Connect server
        if: always()
        shell: bash
        run: '[ -n "$SPARK_CONTAINER_ID" ] && docker rm -f "$SPARK_CONTAINER_ID" || true'

      - name: Enforce minimum test count
        run: |
          python - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          total = 0
          for f in glob.glob("dist/test/reports/*.xml"):
              root = ET.parse(f).getroot()
              for ts in root.iter("testsuite"):
                  total += int(ts.get("tests", 0)) - int(ts.get("skipped", 0))
          print(f"Total tests run: {total}")
          if total < 1:
              print("::error::Fewer than 1 tests were run", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Generate Wheels
        run: pants package src/

      - name: Upload Wheels
        uses: actions/upload-artifact@main
        with:
          name: wheels
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Promote pre-migrated Spark image to latest
        # Only a push to main (i.e. a merge) moves `latest`, and only once its
        # tests have passed. Retags the exact image the tests ran against.
        if: github.ref_name == 'main'
        shell: bash
        run: |
          docker tag "$MIGRATED_SPARK_IMAGE" "$GHCR_IMAGE:latest"
          docker push "$GHCR_IMAGE:latest"

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

      - name: Apply ddl
        env:
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_SERVERLESS_COMPUTE_ID: auto
        run: |
            # Per-branch slug (e.g. "main"); shared with the cleanup workflow so
            # deploy and destroy resolve to the same deployment. See the script.
            branch_cat="$(bash scripts/branch_slug.sh "$GITHUB_REF_NAME")"
            # main uses the shared catalog; other branches get a per-branch one.
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              cat_name="dbr_dbc_cat"
            else
              cat_name="${branch_cat}_dbr_dbc_cat"
            fi
            # Share the computed catalog and branch slug with later steps (deploy).
            echo "CAT_NAME=${cat_name}" >> "$GITHUB_ENV"
            echo "BRANCH_SLUG=${branch_cat}" >> "$GITHUB_ENV"
            pants run src/crutch_migrations:spark-sql-migrations -- run --cat="${cat_name}" --schema=testing_testing \
              --migrations-dir="${GITHUB_WORKSPACE}/src/crutch_migrations"
            echo "done running spark-sql-migrations!!!!"

      - name: Deploy manipulator_job (Databricks bundle)
        working-directory: dab
        env:
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
            # Reuse the catalog computed in Apply ddl (via $GITHUB_ENV). main uses
            # the canonical, non-branch-scoped target; other branches use the
            # branch-isolated dev target.
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              databricks bundle validate -t main --var="catalog=${CAT_NAME}" --var="schema=testing_testing"
              databricks bundle deploy -t main --var="catalog=${CAT_NAME}" --var="schema=testing_testing"
            else
              databricks bundle validate -t dev --var="catalog=${CAT_NAME}" --var="schema=testing_testing" --var="branch=${BRANCH_SLUG}"
              databricks bundle deploy -t dev --var="catalog=${CAT_NAME}" --var="schema=testing_testing" --var="branch=${BRANCH_SLUG}"
            fi
