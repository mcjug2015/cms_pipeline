# Databricks Asset Bundle for the cms_pipeline "manipulator" python-wheel job.
bundle:
  name: cms_pipeline_manipulator

# Pull in every job/pipeline definition under resources/.
include:
  - resources/*.yml

# Applied to every resource in this bundle, so the ACL is declared once rather
# than repeated in each resources/*.yml. DAB merges it with the IS_OWNER it adds
# for the deploying principal. Note this is a workspace ACL over the job and
# dashboard objects only -- Unity Catalog grants live in the migration chains.
permissions:
  - group_name: users_and_sps
    level: CAN_MANAGE

# Values wired into the job below. Override per-target or with `--var`.
variables:
  catalog:
    description: Unity Catalog the manipulator writes to.
    default: dbr_dbc_cat
  schema:
    description: Schema the manipulator writes to.
    default: testing_testing
  cms_zip_prefix:
    description: >-
      s3 prefix watched by the file-arrival trigger and scanned for zips that
      have no 'loaded' row in open_cms_load_ledger yet. This default is the
      canonical prefix the main target deploys against; dev overrides it with a
      per-branch one so a branch's test zips never reach main's job.
    default: s3://manipulator-bucket/cms_files/
  branch:
    description: >-
      Git branch slug this deployment belongs to. Isolates each branch's job
    default: local

artifacts:
  manipulator_wheel:
    type: whl
    build: pants package ../src
    files:
      - source: ../dist/src_cms_pipeline_manipulator-0.0.1-py3-none-any.whl

targets:
  dev:
    mode: development
    default: true
    variables:
      # Sibling of cms_files/, never a child: the loader lists its prefix
      # recursively, so nesting branch zips under the canonical prefix would
      # feed them to main's job and to main's file-arrival trigger.
      cms_zip_prefix: s3://manipulator-bucket/cms_files_dev/${var.branch}/
    workspace:
      host: https://dbc-807557d7-311c.cloud.databricks.com
      # Per-branch state path -> each branch manages its own job rather than
      # updating a single shared one (job identity follows the state location).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/${var.branch}
    presets:
      # Per-branch name prefix so the jobs are distinguishable in the UI. In
      # development mode DAB requires the prefix to contain the current user
      name_prefix: "[dev ${workspace.current_user.short_name} ${var.branch}] "

  main:
    # Canonical, non-branch-scoped deployment for pushes to main: fixed state
    # path and name (no ${var.branch}), so there is a single main job.
    mode: development
    workspace:
      host: https://dbc-807557d7-311c.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: "[${bundle.target} ${workspace.current_user.short_name}] "

