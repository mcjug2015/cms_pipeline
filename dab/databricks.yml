# Databricks Asset Bundle for the harness "manipulator" python-wheel job.
bundle:
  name: harness_manipulator

# Pull in every job/pipeline definition under resources/.
include:
  - resources/*.yml

# Values wired into the job below. Override per-target or with `--var`.
variables:
  catalog:
    description: Unity Catalog the manipulator writes to.
    default: dbr_dbc_cat
  schema:
    description: Schema the manipulator writes to.
    default: testing_testing
  branch:
    description: >-
      Git branch slug this deployment belongs to. Isolates each branch's job
    default: local

artifacts:
  manipulator_wheel:
    type: whl
    build: pants package ../src
    files:
      - source: ../dist/src_harness_manipulator_manipulator-0.0.1-py3-none-any.whl

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-807557d7-311c.cloud.databricks.com
      # Per-branch state path -> each branch manages its own job rather than
      # updating a single shared one (job identity follows the state location).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/${var.branch}
    presets:
      # Per-branch name prefix so the jobs are distinguishable in the UI. In
      # development mode DAB requires the prefix to contain the current user
      name_prefix: "[dev ${workspace.current_user.short_name} ${var.branch}] "

