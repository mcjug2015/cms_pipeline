[tool.black]
line-length = 120


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"


[tool.isort]
profile = "black"
# the black profile pins 88; keep both tools on this repo's 120
line_length = 120


[tool.coverage.run]
branch = true


[tool.coverage.report]
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "def __init__\\(.*\\):\\s*\\S",
    "def get_\\w*\\(.*\\):\\s*\\S",
]