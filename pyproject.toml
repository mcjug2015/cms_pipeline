[black]
line-length=120


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"


[tool.isort]
profile = "black"


[tool.coverage.run]
branch = true


[tool.coverage.report]
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "def __init__\\(.*\\):\\s*\\S",
    "def get_\\w*\\(.*\\):\\s*\\S",
]